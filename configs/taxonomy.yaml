# 统一缺陷本体（航空维修语义）
# 所有源数据集的原始类别名都会被映射到这里的 canonical 类型。
# 新增数据集时，只需在 aliases 里追加原始类别名即可。

version: 1

defect_types:

  fastener_missing:
    zh: 紧固件缺失
    en: missing fastener
    group: fastener            # 紧固件族（螺丝/螺栓/铆钉）
    severity_default: major
    aliases: [missing-head, missing_head, missing, missing_screw, missing_pushpin,
              missing_bolt, missing_rivet, missing_nut, missing_washer, absent,
              missing_connector, missing_cable, missing_separator, lost_head]
    action: 补装同规格紧固件并按扭矩值复紧，检查孔位是否扩孔或撕裂

  fastener_loose:
    zh: 紧固件松动
    en: loose fastener
    group: fastener
    severity_default: major
    aliases: [loose, loosened, looseness, bolt_loose, rotation, rotated, backed_out,
              protruding, proud_head, lifted]
    action: 按 AMM 规定扭矩复紧，复紧后做防松标记线

  thread_damage:
    zh: 螺纹损伤
    en: thread damage
    group: fastener
    severity_default: major
    aliases: [thread_side, thread_top, thread, stripped_thread, manipulated_front,
              front_bent, deformed_thread]
    action: 更换紧固件，检查配合螺孔螺纹是否同步损伤

  fastener_wrong_spec:
    zh: 紧固件规格不符
    en: wrong fastener specification
    group: fastener
    severity_default: major
    aliases: [screw_too_long, screw_too_short, 1_very_short_screw, wrong_screw,
              mismatch, wrong_part, swapped]
    action: 按 IPC 件号核对并更换为正确规格

  corrosion:
    zh: 腐蚀锈蚀
    en: corrosion
    group: surface
    severity_default: major
    aliases: [corrosion, rust, rusty, oxidation, oxidized, pitting, pit, pitted,
              crazing, rolled-in_scale, severe, poor, fair, corroded]
    action: 按 SRM 打磨除锈并评估剩余厚度，补涂防腐底漆

  crack:
    zh: 裂纹
    en: crack
    group: structure
    severity_default: critical
    aliases: [crack, cracked, cracks, crazing_crack, fracture, fissure, rupture]
    action: 立即停用该区域，做无损检测确定裂纹长度并按 SRM 制定修理方案

  dent:
    zh: 凹坑
    en: dent
    group: structure
    severity_default: major
    aliases: [dent, dented, dint, depression, deformation, bent, deformed, bend]
    action: 测量凹坑深径比，对照 SRM 可接受限度判定打磨、堆修或换件

  scratch:
    zh: 划伤
    en: scratch
    group: surface
    severity_default: minor
    aliases: [scratch, scratches, scratch_head, scratch_neck, scratched, scuff,
              abrasion, gouge, nick]
    action: 抛光去除应力集中源并补涂保护涂层

  paint_peeling:
    zh: 漆层剥落
    en: paint peeling
    group: surface
    severity_default: minor
    aliases: [paint-peel-off, paint_peel_off, peel, peeling, flaking, flake,
              coating_loss, blister, patches]
    action: 清理松动漆层，按涂装规范补漆，防止下方基材腐蚀

  breakage:
    zh: 断裂破损
    en: breakage
    group: structure
    severity_default: critical
    aliases: [broken, break, part_broken, bag_broken, broken_cable, hole, puncture,
              tear, torn]
    action: 更换受损件，检查相邻结构是否受连带损伤

  contamination:
    zh: 污染异物
    en: contamination
    group: surface
    severity_default: minor
    aliases: [contamination, contaminated, foreign_object, fod, stain, dirt, grease,
              leak, oil_leak, spot, inclusion, spots]
    action: 清洁并溯源渗漏点，确认非液压/燃油渗漏

  misalignment:
    zh: 错位不齐
    en: misalignment
    group: structure
    severity_default: major
    aliases: [misplaced, misaligned, wrong_cable_location, shift, offset,
              wrong_position, tilted]
    action: 按图纸复位并重新紧固，检查孔位偏差

  extra_part:
    zh: 多余件
    en: extra / redundant part
    group: structure
    severity_default: major
    aliases: [extra_cable, 1_additional_pushpin, additional, redundant, duplicate]
    action: 移除多余件并排查装配工序，防止 FOD

  other_anomaly:
    zh: 异常
    en: anomaly
    group: other
    severity_default: minor
    aliases: [anomaly, defect, damage, bad, abnormal, combined, misc]
    action: 记录并由持照人员进一步评估

# 对象（被检部件）映射
objects:
  screw:        {zh: 螺钉,   role: fastener,  aircraft_ctx: 蒙皮壁板紧固螺钉}
  bolt:         {zh: 螺栓,   role: fastener,  aircraft_ctx: 结构连接螺栓}
  nut:          {zh: 螺母,   role: fastener,  aircraft_ctx: 结构连接螺母}
  rivet:        {zh: 铆钉,   role: fastener,  aircraft_ctx: 蒙皮铆接铆钉}
  washer:       {zh: 垫圈,   role: fastener,  aircraft_ctx: 紧固垫圈}
  screw_bag:    {zh: 紧固件组件, role: fastener_kit, aircraft_ctx: 紧固件套件清点}
  fuselage:     {zh: 机身蒙皮, role: structure, aircraft_ctx: 机身蒙皮壁板}
  panel:        {zh: 检查口盖, role: structure, aircraft_ctx: 可卸口盖壁板}
  wing:         {zh: 机翼,   role: structure, aircraft_ctx: 机翼外表面}
  pcb:          {zh: 电路板, role: avionics,  aircraft_ctx: 航电模块电路板}
  metal_part:   {zh: 金属零件, role: structure, aircraft_ctx: 金属结构件}
  unknown:      {zh: 待检部件, role: unknown,  aircraft_ctx: 待检部件}

# 有序程度分级。
# 有些数据集给的不是"有/无"而是**有序的程度标签**（VT 腐蚀集的
# good/fair/poor/severe 就是按 AASHTO 与桥梁检查员手册标的），
# 把它们塌成一个"腐蚀锈蚀"等于把最有价值的信息扔了。
# 这里把等级映射成自然语言的程度词 + 对应的严重度与处置方案，
# 构建器会优先采用等级给出的严重度，而不是按面积占比估。
grades:
  corrosion:
    order: [good, fair, poor, severe]
    levels:
      good:
        zh: 轻微锈蚀
        severity: minor
        desc: 涂层基本完整，表面可见零星锈点，未见起皮
        action: 清洁表面并做好记录，按计划监控发展
      fair:
        zh: 点蚀起皮
        severity: major
        desc: 锈层起皮，基材出现明显点蚀坑
        action: 除锈至金属基材，测量点蚀深度后补涂防腐底漆
      poor:
        zh: 层状剥落
        severity: major
        desc: 呈层状剥蚀，锈层成片脱落，基材受蚀范围扩大
        action: 机械除锈并评估剩余壁厚，按 SRM 判定是否需要补强
      severe:
        zh: 截面损失
        severity: critical
        desc: 腐蚀已造成可测量的截面损失，承载能力下降
        action: 立即停用该区域，测量剩余截面并按 SRM 制定换件或补强方案

# 严重度
severity:
  minor:    {zh: 轻微, en: minor,    desc: 不影响适航，监控并按计划处理}
  major:    {zh: 中等, en: major,    desc: 需在本次检修中处理}
  critical: {zh: 严重, en: critical, desc: 影响结构完整性，需立即处置}
