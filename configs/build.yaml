# VQA 构建配置
seed: 20260914

# Qwen3-VL 原生坐标：[0,1000] 归一化。用 ms-swift 的 grounding 格式时改成 abs。
coord_mode: norm1000
box_label: zh            # 框里的 label 用中文 / en / canonical
# 问法语言：zh = 只用中文问法（默认）；bilingual = 保留英文问法。
# 英文问法原本占 3% 左右，不足以教会双语却会引入中英混杂，所以默认关掉。
lang: zh
# 答案里是否给缺陷名加英文术语括注（"漆层剥落（paint peeling）"）。
# 只在部分任务出现会显得中英混杂不一致，所以默认关掉。
term_annotation: false

max_qa_per_sample: 4
n_options: 4
skip_unknown_type_tasks: true   # 源数据没有细粒度类型时，不出"这是什么缺陷"的题

# 本期做的缺陷类型（8 类）。不在名单里的会降级成 other_anomaly：
# 框还是真的，定位与"有无异常"照用，只是不再出"这是什么缺陷"的题。
# 置空 / 删掉这一项 = 本体里 14 类全做。
active_defect_types:
  - fastener_missing      # 紧固件缺失
  - fastener_loose        # 紧固件松动
  - thread_damage         # 螺纹损伤（只有特写场景能看见）
  - crack                 # 裂纹（critical）
  - corrosion             # 腐蚀锈蚀
  - dent                  # 凹坑
  - scratch               # 划伤
  - paint_peeling         # 漆层剥落
  # - fastener_damage     # 紧固件损伤（粗粒度）。默认不开：UTS 那批只标了
  #                       # "Fastener Damage"，没说是滑丝/松动/头部破损，
  #                       # 开了会和上面三个细类打架。关着它的框照样喂定位，
  #                       # 只是类型题上降级成"异常"。

# 大模型扩写出的问法库；不存在就只用种子问法，不影响流水线
question_bank: configs/question_bank.json

# 单个数据源最多占样本总量的多少（<=0 或删掉 = 不限制）
#
# 为什么需要：Real-IAD 两万条占全库 53%，而它拍的是灯箱里的端子排、电路板。
# 指标要的是**飞机**蒙皮上的缺陷识别，一半训练数据是工业小件会把视觉先验
# 带偏。限流按该源自身的正负比例分层下采样，不动正负比。
max_share_per_dataset: 0.25

# 按源过采样/下采样（乘数，在限流之前生效）。航空域样本少，顶一顶。
# 注意过采样是重复同一张图，顶太高会过拟合到那几百张上，1.5~3 是稳妥区间。
dataset_weights:
  aircraft_skin_defects: 3.0   # 372 张，唯一直接标了 Missing-head 的真实航空源
  synthetic_closeup: 1.5       # 螺纹损伤的主要来源

# 样本层平衡：每 1 张异常图保留多少张正常图（<=0 不限制）
# 1.0 即正负 1:1 —— "缺陷识别准确率"是在这个先验下测的，改了指标就不可比
normal_per_anomalous: 1.0

# 类别均衡：类型识别任务里，最多的缺陷类不超过最少类的多少倍（<=0 不启用）
# "异常类别识别准确率"按宏平均算时，长尾类样本太少会直接把指标拖下来
class_max_over_min: 3.0
class_balance_tasks: [classification_open, classification_mc]

# 问答层目标配比（会自动归一化；供给不足时缺口按权重重分配）
# 配比对标两项验收指标：
#   缺陷识别准确率 >= 90%  -> discrimination + multi_turn 第一轮
#   异常类别识别准确率 >= 88% -> classification_open + classification_mc
# 以及"局部结构视觉聚焦与语义定位"这项功能要求 -> grounding / referring / region_word
task_ratio:
  # ---- 缺陷识别（对标 >=90%）15% ----
  discrimination: 0.14
  # ---- 异常类别识别（对标 >=88%）18% ----
  classification_open: 0.10
  classification_mc: 0.08
  # ---- 视觉聚焦与语义定位 45% ----
  grounding_single: 0.13
  grounding_all: 0.10
  # 负样本合计 14%：正常图 6% + 反事实 8%。
  # 反事实（有缺陷的图上问一个不存在的类型 -> []）比正常图难得多，
  # 是抑制"用户说有就一定有"的关键，权重要高于正常图负样本。
  grounding_negative: 0.06
  grounding_counterfactual: 0.08
  referring_region: 0.05       # 难负样本贴着缺陷旁边采，对应"局部结构聚焦"
  region_word: 0.02
  counting: 0.03               # 含 0/1/多 三种边界
  # ---- 多轮追问 8% ----
  multi_turn: 0.08
  # ---- 多图对比 4%（正常件参考图 + 待检图 -> 指出差异）----
  # 机务实际就是比着看的；MMAD 与 Anomaly-OV 都强调这个能力
  pair_compare: 0.04
  # ---- 不确定表达 4%（成像模糊/遮挡/过曝 -> 无法确认，建议补拍）----
  # system 里写了"无法确认时直接说明"，必须有样本把它教出来，否则是空指令
  uncertainty: 0.04
  # ---- 辅助能力 10% ----
  description: 0.05
  severity_action: 0.03
  object_recognition: 0.01

# 单张图最多被采纳的问答数（在 task_ratio 之后再限一次）
split_ratios: [0.95, 0.03, 0.02]

export:
  format: sharegpt          # sharegpt | llamafactory | swift | openai
  with_system: true
  relative_paths: false
  # 在条目里带 id 与 meta（task/dataset/split/label/defect_types…）。
  # 训练框架会忽略不认识的键，但分层评测和排错离不开它们。
  with_meta: true

llm:
  # 模型池配置文件。留空 = 不启用改写层，流水线照常跑。
  # 池里可以放多个模型，按权重路由、失败自动转移，改配置不用动代码。
  pool_config: configs/llm_pool.json
  purpose: rewrite          # 用哪个用途的参数，见 llm_pool.json 的 purposes
