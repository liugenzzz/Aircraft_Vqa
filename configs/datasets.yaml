# 数据源清单。每个条目 = 一个 adapter 实例。
# root 指向你本地解压后的目录；enabled: false 的先不参与构建。
# 详细调研见 docs/01_dataset_survey.md。

defaults:
  data_root: ~/data/raw        # 各条目 root 里的 {data_root} 会被替换

datasets:

  # ---------------- 冷启动：免申请、可商用、能直接 wget ----------------
  - name: visa
    adapter: visa
    root: "{data_root}/VisA"
    enabled: true
    priority: 1
    license: "CC BY 4.0"
    commercial_ok: true
    url: https://registry.opendata.aws/visa/
    download: scripts/download/download_visa.sh
    split_csv: 1cls.csv
    # 只取 PCB 四类：candle/capsules/cashew/macaroni 这些食品与日用品类目
    # 对航空结构件没有迁移价值，混进来只会稀释训练信号。
    categories: [pcb1, pcb2, pcb3, pcb4]
    # VisA 发布版只有 Anomaly/Normal 两级标签，没有细粒度缺陷名。
    # 这里刻意不臆造类型：统一落到 other_anomaly，构建器会自动跳过
    # "缺陷类型"这类问题，只用它做定位 + 有无判定。
    object_hint:
      pcb1: pcb
      pcb2: pcb
      pcb3: pcb
      pcb4: pcb
    notes: "定位能力主力来源之一；PCB 类的缺件语义与'少一颗螺丝'同构。"

  # ---------------- 紧固件细粒度语义（研究用，非商用） ----------------
  - name: mvtec_ad_screw
    adapter: mvtec_ad
    root: "{data_root}/MVTec_AD"
    # 目录名不一致时的候选（按类别分包下载的人目录名往往不一样）
    root_alternatives: ["{data_root}/mvtec_anomaly_detection", "{data_root}/mvtec_ad"]
    enabled: false
    priority: 1
    license: "CC BY-NC-SA 4.0"
    commercial_ok: false
    url: https://www.mvtec.com/company/research/datasets/mvtec-ad
    download: scripts/download/download_mvtec_ad.sh
    categories: [screw, metal_nut]
    object_hint:
      screw: screw
      metal_nut: nut
    notes: "螺纹损伤/头部划伤 + 像素级 mask，缺陷定位的金标准。"

  - name: mvtec_loco_screwbag
    adapter: mvtec_loco
    root: "{data_root}/MVTec_LOCO_AD"
    root_alternatives: ["{data_root}/mvtec_loco_anomaly_detection",
                        "{data_root}/mvtec_loco"]
    enabled: false
    priority: 1
    license: "CC BY-NC-SA 4.0"
    commercial_ok: false
    url: https://www.mvtec.com/company/research/datasets/mvtec-loco
    download: scripts/download/download_mvtec_loco.sh
    categories: [screw_bag]
    object_hint:
      screw_bag: screw_bag
    notes: "缺件/数量错/规格错 —— 最贴近'螺丝缺失'语义。可放 defect_names.json 细化类型。"

  - name: mpdd
    adapter: mpdd
    root: "{data_root}/MPDD"
    enabled: false
    priority: 2
    license: "CC BY-NC-SA 4.0"
    commercial_ok: false
    url: https://github.com/stepanje/MPDD
    object_hint:
      metal_plate: metal_part
      bracket_black: metal_part
      bracket_brown: metal_part
      bracket_white: metal_part
      connector: metal_part
      tubes: metal_part
    notes: "金属喷漆件，多光照多角度，提升金属反光鲁棒性。"

  - name: real_iad
    adapter: real_iad
    root: "{data_root}/Real-IAD"
    enabled: false
    priority: 2
    license: "CC BY-NC-SA 4.0 —— 禁止商用"
    commercial_ok: false
    url: https://huggingface.co/Real-IAD
    # 按分辨率分包：realiad_256 / _512 / _1024 / _raw。别下 raw（200GB），
    # 取 512 加三五个金属/紧固类物体，几 GB 就够起步。
    image_dir: realiad_512
    json_dir: realiad_jsons
    # 只列你实际下了的类，注释掉则全用（会去找不存在的目录，白报一堆 miss）
    categories: [terminalblock, pcb, u_block, switch]
    notes: "每个视角单独标注 —— 同一个有缺陷的物体，从看不见缺陷的角度拍的那张，
      标签就是 good。'单视角结论不可靠、要换角度确认'这件事的监督信号是现成的，
      不用自己造，正对'局部结构视觉聚焦'这项要求。"

  # ---------------- 航空域（决定最终域表现，建议过采样） ----------------
  - name: aircraft_skin_defects
    adapter: coco
    root: "{data_root}/roboflow/aircraft_skin_defects"
    enabled: false
    priority: 1
    license: "见 Roboflow 项目页（多为 CC BY 4.0）"
    commercial_ok: false
    url: https://universe.roboflow.com/ddiisc/aircraft_skin_defects
    download: scripts/download/download_roboflow.py
    category: fuselage
    object_hint:
      fuselage: fuselage
    splits: [train, valid, test]
    notes: "类别含 Missing-head（紧固件缺失），是唯一直接命中'螺丝缺失'的航空标注。"

  - name: uts_aircraft_defect
    adapter: coco
    root: "{data_root}/roboflow/aircraft-defect-detection"
    enabled: false
    priority: 1
    license: "见 Roboflow 项目页"
    commercial_ok: false
    url: https://universe.roboflow.com/university-of-technology-sydney-21uto/aircraft-defect-detection
    category: fuselage
    object_hint:
      fuselage: fuselage
    notes: "9352 张，目前能拿到的最大航空缺陷检测集。"

  - name: aircraft_fuselage_det2023
    adapter: coco
    root: "{data_root}/Aircraft_Fuselage_DET2023"
    enabled: false
    priority: 1
    license: "IEEE DataPort 条款；引用需写作者那篇半监督论文"
    commercial_ok: false
    url: https://ieee-dataport.org/documents/aircraftfuselagedet2023-aircraft-fuselage-defect-detection-dataset
    category: fuselage
    object_hint:
      fuselage: fuselage
    splits: [train, valid, test]
    notes: "5,601 张，不同光照下实拍机身不同部位的四类表面缺陷。
      包内前三个子目录是同一批图的 COCO / VOC / YOLO 三种标注，用 COCO 那份；
      第四个是无标注池，做半监督或自训练时再用（作者刻意留的）。"

  # ---------------- 锈蚀分级 ----------------
  - name: corrosion_cs_vt
    adapter: mask_seg
    root: "{data_root}/corrosion_cs"
    enabled: false
    priority: 2
    license: "学术开放，商用需确认"
    commercial_ok: false
    url: https://data.lib.vt.edu/articles/dataset/Corrosion_Condition_State_Semantic_Segmentation_Dataset/16624663
    category: metal_part
    images_dir: images
    masks_dir: masks
    # 这四个名字不是四种缺陷，而是「腐蚀」这一种缺陷的**有序等级**
    # （AASHTO / 桥梁检查员手册的腐蚀状态标准），所以用 grade_type 显式声明。
    # 等级会映射成程度词（轻微锈蚀/点蚀起皮/层状剥落/截面损失）并决定严重度。
    grade_type: corrosion
    # mask 是 P 模式 + VOC 调色板，实测类别索引只有 0/1/2/3 四个。
    # 索引 0 铺满每一张图、占比最大 —— 是未腐蚀的背景（AASHTO 的 Good 状态
    # 就是"表面完好"），所以它走 background_values 被跳过，不产出缺陷框；
    # 真正的缺陷是 1/2/3 三级。索引 3 只出现在约两成图里，符合"最严重的最少见"。
    #
    # 注意：别再照 inspect_masks 里那种 convert("L") 的读法填 38/75/113 ——
    # 那是调色板颜色的亮度，不是类别索引。load_mask 已经按 P 模式直读索引。
    #
    # !! 等级顺序（越大越严重）务必肉眼核对过再往下走，填反了模型会学成
    #    "锈得越狠越说没事"，比不用这份数据更有害：
    #    python scripts/arrange_corrosion.py --root data/raw/corrosion_cs \
    #        --grade-preview /tmp/corr_preview
    class_map: {1: fair, 2: poor, 3: severe}
    background_values: [0]
    notes: "440 张 4 级腐蚀像素分割，支撑'锈蚀到什么程度 / 怎么处理'的分级问答。
      索引 0（Good，未腐蚀）当背景，实际产出 fair/poor/severe 三级缺陷。"

  # ---------------- 合成数据（本仓库生成，完全可商用） ----------------
  - name: synthetic_panel
    adapter: coco
    root: "{data_root}/synthetic/panel"
    enabled: true
    priority: 1
    license: "自有合成数据"
    commercial_ok: true
    download: scripts/make_demo_data.py
    category: panel
    object_hint:
      panel: panel
    splits: [train, valid, test]
    notes: "蒙皮铆钉阵列（俯视）：紧固件缺失/松动、锈蚀、划伤、凹坑、漆层剥落、
      裂纹（从紧固件孔边起裂，符合疲劳裂纹真实萌生位置）。"

  - name: synthetic_closeup
    adapter: coco
    root: "{data_root}/synthetic/closeup"
    enabled: true
    priority: 1
    license: "自有合成数据"
    commercial_ok: true
    download: scripts/make_demo_data.py
    category: bolt
    object_hint:
      bolt: bolt
    splits: [train, valid, test]
    notes: "紧固件特写（侧视）：螺纹损伤、杆部锈蚀、头部划伤。
      螺纹在俯视铆钉阵列里根本看不见，必须单独出特写场景。"
